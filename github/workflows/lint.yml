name: Lint Code

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: |
          pip install flake8 black

      - name: Run Flake8
        run: |
          flake8 . --count --show-source --statistics || true

      - name: Check Formatting
        run: |
          black . --check || true
